<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signature LAN Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 1rem; text-align: center; }
        h1 { color: #16a34a; }
        a { display: inline-block; margin: 0.5rem; padding: 0.75rem 1.25rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; }
        .note { color: #666; font-size: 0.9rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <h1>Signature OK</h1>
    <p>Phone / tablet server se connect ho gaya.</p>
    <a href="/login">Login</a>
    <a href="/restaurant-pos">Restaurant POS</a>
    <p class="note">URL: <strong id="lan-url">http://…/</strong> — https mat use karein.</p>
    <p style="color:#b45309;font-size:0.85rem;margin-top:1rem;">Timeout / site can't be reached?<br>Tablet WiFi se server PC (Ethernet) tak block ho sakta hai.<br>Router mein <strong>AP Isolation OFF</strong> karein, ya server cable extender ke LAN port mein lagao.</p>
    <script>
        (function () {
            var host = location.hostname || '192.168.1.105';
            var url = location.protocol + '//' + host + (location.port ? ':' + location.port : '') + '/';
            var el = document.getElementById('lan-url');
            if (el) el.textContent = url;
        })();
    </script>
</body>
</html>
